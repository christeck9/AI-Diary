<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #222;
      color: #fff;
      font-family: sans-serif;
      margin: 20px;
    }
    .container {
      display: flex;
      gap: 20px;
      flex-wrap: wrap;
    }
    .card {
      background: #333;
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }
    img {
      max-width: 350px;
      border: 1px solid #555;
      border-radius: 4px;
    }
    h3 {
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>Zen Garden Layout Comparison</h2>
  <div class="container">
    <div class="card">
      <img src="./assets/images/zengarden-bg.png" />
      <h3>Night BG (1024x1024)</h3>
    </div>
    <div class="card">
      <img src="./assets/images/cropped_simulation.png" />
      <h3>Centred Cover Crop Simulation (360x800)</h3>
    </div>
    <div class="card">
      <img src="./assets/images/screenshot.png" />
      <h3>Emulator Screenshot</h3>
    </div>
  </div>
</body>
</html>
